CONFIG_SPINALI=y
CONFIG_SPINALI_APP_NAME="RTK GNSS"

CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO_BUILD_DATE_TIME=y
CONFIG_MCUMGR_GRP_OS_INFO_CUSTOM_HOOKS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_HWINFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_USE_THREAD_NAME_FOR_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_BASE64=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TICKLESS_KERNEL=n
CONFIG_I3C=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_FPU=y

CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24

# Sensor streaming
CONFIG_ZROS_SENSE_STREAM=y
CONFIG_ZROS_SENSE_STREAM_IMU=y
CONFIG_ZROS_SENSE_STREAM_MAG=y
CONFIG_ZROS_SENSE_GNSS=y

# GNSS Configuration
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=y
CONFIG_GNSS_LOG_LEVEL_DBG=y
CONFIG_GNSS_U_BLOX_F9P_TIMEPULSE=y

# GNSS PPS discipline: CTIMER capture of TIMEPULSE + ENET QoS PHC
CONFIG_SPINALI_TIMING=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_CTIMER=y
CONFIG_COUNTER_CAPTURE=y
CONFIG_PTP_CLOCK=y

# RTC (FRO16K; boot-time seed / GNSS-set wall clock)
CONFIG_RTC=y
CONFIG_RTC_SHELL=y

# gPTP grandmaster (IEEE 802.1AS) serving GNSS-disciplined time.
# The node boots at the honest defaults (clockClass 248, timeSource
# internal oscillator): clockClass and timeSource are owned at runtime
# by the PPS servo, which promotes to clockClass 6 / timeSource GPS on
# lock and demotes to clockClass 7 on holdover. Accuracy 100 ns is the
# locked servo performance and applies once promoted.
CONFIG_NET_GPTP=y
CONFIG_NET_GPTP_GM_CAPABLE=y

# RTK Support
CONFIG_GNSS_RTK=y
CONFIG_RM3100_STREAM=y

CONFIG_SHELL=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_INFO=y

CONFIG_SPINALI_SYNAPSE_MCUMGR_HOOKS=y
CONFIG_MCUMGR_GRP_HCDF=y
CONFIG_MCUMGR_GRP_HCDF_URL="https://hcdf.cognipilot.org/mr_mcxn_t1/rtk-gnss/rtk-gnss.hcdf"
CONFIG_MCUMGR_GRP_HCDF_SHA="87950c40"

CONFIG_SPINALI_SYNAPSE_TOPIC=y
CONFIG_SPINALI_CORE_COMMON=y
CONFIG_SPINALI_CORE_COMMON_BOOT_BANNER=y
CONFIG_ZROS=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_SPINALI_RTK_GNSS_LOG_LEVEL_DBG=y

CONFIG_SENSOR_SHELL_STREAM=y
CONFIG_SENSOR_SHELL_THREAD_STACK_SIZE=8192
CONFIG_SENSOR_LOG_LEVEL_DBG=n

# modules

# General config
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-2

# Networking config
CONFIG_NET_SHELL=y
CONFIG_NETWORKING=y
# IPv6-native, router-less peer mesh, no IPv4. The node self-assigns a stable
# EUI-64 interface identifier from its UUID-seeded MAC, so addressing is
# zero-config and reboot-stable with no DHCP and no router. IPv6 MLD is needed
# to join the ff02:: multicast group used for peer discovery.
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IPV6_IID_EUI_64=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
# zenoh-pico session needs a heap pool and enough file descriptors to open
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=49152

# Network address config
CONFIG_NET_HOSTNAME="rtk-gnss"
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_MONITOR=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_MY_IPV6_ADDR=""
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# STATS
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SCHED_THREAD_USAGE_AUTO_ENABLE=y

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ZROS_SENSE_RTCM3_SUB=y

# csyn synapse transport over zenoh-pico, router-less IPv6 peer mesh.
# csyn owns the value contract from the pinned synapse_fbs catalog and drives
# the zenoh-pico session; the spinali csyn bridge only shuttles fixed-layout
# structs between the in-process zros bus and the csyn store. The built-in csyn
# zros bridge is left off so the spinali bridge is the only zros path, and the
# flatbuffer store bound is raised to cover the 1036-byte rtcm3 fixed layout.
# CSYN_ZENOH and the UDP-multicast posture select ZENOH_PICO with the multicast
# link and scouting; the peer locator carries the mandatory #iface segment.
CONFIG_SPINALI_SYNAPSE_CSYN=y
CONFIG_SPINALI_SYNAPSE_CSYN_LOG_LEVEL_DBG=y
CONFIG_CSYN=y
CONFIG_CSYN_ZROS_BRIDGE=n
CONFIG_CSYN_FLATBUFFER_MAX_SIZE=1088
CONFIG_CSYN_ZENOH=y
CONFIG_CSYN_ZENOH_MODE="peer"
CONFIG_CSYN_ZENOH_LOCATOR="udp/[ff02::224]:7446#iface=eth0"
CONFIG_CSYN_ZENOH_POSTURE_UDP_MULTICAST=y
# Executor thread stack for the native zenoh-pico backend (matches csyn calibration).
CONFIG_ZENOH_PICO_ZEPHYR_TASK_STACK_SIZE=6144
