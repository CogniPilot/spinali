CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_BASE64=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TICKLESS_KERNEL=n
CONFIG_I3C=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_FPU=y

CONFIG_NET_BUF_RX_COUNT=36
CONFIG_NET_PKT_RX_COUNT=36
CONFIG_NET_BUF_TX_COUNT=36
CONFIG_NET_PKT_TX_COUNT=24

CONFIG_ZROS_SENSE_STREAM=y
CONFIG_ZROS_SENSE_STREAM_IMU=y
CONFIG_ZROS_SENSE_STREAM_MAG=n
CONFIG_ZROS_SENSE_STREAM_OPTICAL_FLOW=y
CONFIG_ZROS_SENSE_STREAM_ARGUS_POINTCLOUD=y
CONFIG_ZROS_SENSE_STREAM_ARGUS=y

CONFIG_SHELL=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_INFO=y

CONFIG_SPINALI_SYNAPSE_MCUMGR_HOOKS=y
CONFIG_MCUMGR_GRP_HCDF=y
CONFIG_MCUMGR_GRP_HCDF_URL="https://hcdf.cognipilot.org/mr_mcxn_t1/optical-flow/optical-flow.hcdf"
CONFIG_MCUMGR_GRP_HCDF_SHA="d9507e38"

CONFIG_SPINALI_SYNAPSE_TOPIC=y
CONFIG_SPINALI_CORE_COMMON=y
CONFIG_SPINALI_CORE_COMMON_BOOT_BANNER=y
CONFIG_ZROS=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_SPINALI_OPTICAL_FLOW_LOG_LEVEL_DBG=y

CONFIG_SENSOR_SHELL_THREAD_STACK_SIZE=8192
CONFIG_SENSOR_LOG_LEVEL_DBG=n

# modules

# General config
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-2

# Networking config
CONFIG_NET_SHELL=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
# IPv6 multicast (MLD) to join the ff02:: mesh group, and a stable EUI-64
# interface identifier from the UUID-seeded MAC so the mesh address is
# zero-config and reboot-stable. IPv4 is kept for the 10.58.0.12 mcumgr path.
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IPV6_IID_EUI_64=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_VLAN=y
CONFIG_NET_VLAN_COUNT=1
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_CONTEXT_PRIORITY=y

# gPTP (IEEE 802.1AS) SLAVE clock over the T1 link.
# This node runs the gPTP stack without GrandMaster capability (priority1 255),
# so it always yields to the coe grandmaster and follows it as a slave. The
# Ethernet MAC PTP hardware clock (PHC) is then steered onto the grandmaster's
# GNSS-traceable timescale, and the optical-flow producer reads it once synced
# so its timestamps share that domain. NET_GPTP selects PTP_CLOCK and the
# network packet timestamping path (NET_L2_PTP_TIMESTAMPING); PTP_CLOCK is
# listed explicitly to keep the ENET QoS PHC in the build if that select ever
# changes. No GNSS/PPS discipline (SPINALI_TIMING) runs here: the shared time
# arrives over gPTP from the grandmaster, not from a local receiver.
CONFIG_NET_GPTP=y
CONFIG_PTP_CLOCK=y
# Static timeReceiver: the port is pinned to the slave role and the PHC is
# disciplined from received Sync/Follow_Up alone, so the node also locks
# behind an automotive-profile bridge that sends no Announce.
CONFIG_NET_GPTP_STATIC_TIME_RECEIVER=y

# Network address config
CONFIG_NET_HOSTNAME="optical-flow"
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_MONITOR=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.58.0.12"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.0.0"

# STATS
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SCHED_THREAD_USAGE_AUTO_ENABLE=y

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=49152

# Vehicle Optical Flow processing: PAA3905 flow + AFBR range fused into the
# synapse OpticalFlow / OpticalFlowVelocity topics the bridge carries. VOF_RATE=0
# runs the processing at the sensor's motion-driven ODR (up to the 126 Hz PAA3905
# frame rate) with no cap, so no flow frame is dropped before it reaches the mesh.
CONFIG_SPINALI_VEHICLE_OPTICAL_FLOW=y
CONFIG_VOF_RATE=0

# Direct OpticalFlowVelocity delivery to TROPIC. This is independent of the
# optional ROS 2 CDR mirror and does not require Zenoh or CSYN.
CONFIG_SPINALI_SYNAPSE_WIRE=y
CONFIG_SPINALI_SYNAPSE_WIRE_DESTINATION="fe80::4:9fff:fe00:150"
CONFIG_SPINALI_SYNAPSE_WIRE_SOURCE_NODE_ID=12
CONFIG_SPINALI_SYNAPSE_WIRE_RATE_HZ=70
CONFIG_SPINALI_SYNAPSE_WIRE_PCP=5
CONFIG_SPINALI_SYNAPSE_WIRE_LOG_LEVEL_INF=y
