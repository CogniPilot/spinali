CONFIG_SPINALI=y
CONFIG_SPINALI_APP_NAME="CAN over Ethernet"

CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO_BUILD_DATE_TIME=y
CONFIG_HWINFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_USE_THREAD_NAME_FOR_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_BASE64=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_I3C=n
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24

# gPTP (IEEE 802.1AS) time sync over the T1 link.
# The node boots at the honest defaults (clockClass 248, timeSource
# internal oscillator): clockClass and timeSource are owned at runtime
# by the PPS servo, which promotes to clockClass 6 / timeSource GPS on
# lock and demotes to clockClass 7 on holdover. Accuracy 100 ns is the
# locked servo performance and applies once promoted.
CONFIG_NET_GPTP=y
CONFIG_NET_GPTP_GM_CAPABLE=y

# GNSS time discipline: the PHC served to gPTP is steered onto GNSS
# time, and the same clock timestamps every bridged CAN frame, so the
# message timestamps are GPS-traceable network wide. No RTK corrections
# are involved: plain GNSS timing needs none.
CONFIG_SPINALI_TIMING=y

# F9P receiver on the FC7 UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GNSS=y
CONFIG_GNSS_U_BLOX_F9P_TIMEPULSE=y

# CTIMER capture of TIMEPULSE + ENET QoS PHC
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_CTIMER=y
CONFIG_COUNTER_CAPTURE=y
CONFIG_PTP_CLOCK=y

# RTC (FRO16K; boot-time seed / GNSS-set wall clock)
CONFIG_RTC=y

# CAN
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# Deliver remote frames to the RX filters; without this the driver masks
# every RTR frame out of the mailboxes and the bridge never sees them.
CONFIG_CAN_ACCEPT_RTR=y
CONFIG_CAN_SHELL=y
CONFIG_CAN_DEFAULT_BITRATE=1000000
CONFIG_CAN_DEFAULT_BITRATE_DATA=4000000
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_MCUMGR_GRP_STAT=y

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_MODE_DEFERRED=y

# General config
CONFIG_POSIX_API=y
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-2

# Networking config
CONFIG_NET_SHELL=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# IEEE 1722 transport: raw Ethernet packet sockets on ethertype 0x22F0
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_SOCKETS_PACKET_DGRAM=y
CONFIG_NET_ETHERNET_FORWARD_UNRECOGNISED_ETHERTYPE=y

# Network address config
CONFIG_NET_HOSTNAME="coe"
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_MONITOR=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.3"

# STATS
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

CONFIG_ZROS=y
CONFIG_SPINALI_SYNAPSE_TOPIC=y
CONFIG_SPINALI_CORE_COMMON=y
CONFIG_SPINALI_CORE_COMMON_BOOT_BANNER=y
CONFIG_SPEED_OPTIMIZATIONS=y
