manifest:

  group-filter:
    - +optional

  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cognipilot
      url-base: https://github.com/CogniPilot

  projects:
    - name: zephyr
      remote: cognipilot
      west-commands: scripts/west-commands.yml
      revision: spinali-main-next
      import:
        - name-allowlist:
          - mbedtls
          - tf-psa-crypto
          - hal_nxp
          - hal_tdk
          - hal_afbr
          - cmsis
          - cmsis_6
          - cmsis-dsp
          - fatfs
          - segger
          - mcuboot
          - zcbor
    - name: zros
      remote: cognipilot
      revision: 3f80b3ba8803abc02ad7382cc027658b05c07ca6 # main
      path: modules/lib/zros
    - name: cyecca
      remote: cognipilot
      revision: 64d1f0dc5127d85765909f0c3525cc38305dac19 # main 11/17/25
      path: modules/lib/cyecca
    - name: zros_drivers
      remote: cognipilot
      revision: feature/synapse-pb-purge
      path: modules/lib/zros_drivers
    - name: zephyr_boards
      remote: cognipilot
      revision: 614eed3b6432e776f107e948ccb59fda76e034c5 # main
      path: modules/lib/zephyr_boards
    - name: hcdf_models
      remote: cognipilot
      revision: main
      path: modules/lib/hcdf_models
    - name: zenoh-pico
      url: https://github.com/CogniPilot/zenoh-pico.git
      revision: d1880874de7a792f41f30f563ddc3ec4956fe3ea # spinali-1.9 + Zephyr UDP-multicast join + IPv6-only fixes
      path: modules/lib/zenoh-pico
    - name: csyn
      remote: cognipilot
      revision: 173d1989915ac67433153c305e07158cf8f50c49 # synapse_fbs 0.9.0 + configurable zenoh posture
      path: modules/lib/csyn
