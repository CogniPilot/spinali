manifest:

  group-filter:
    - +optional

  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cognipilot
      url-base: https://github.com/CogniPilot

  projects:
    - name: zephyr
      remote: cognipilot
      west-commands: scripts/west-commands.yml
      revision: cb86e25cfbd57d3b8d15fceaa94cba088cff3c0c # spinali-main
      import:
        - name-allowlist:
          - nanopb
          - mbedtls
          - tf-psa-crypto
          - hal_nxp
          - hal_tdk
          - hal_afbr
          - cmsis
          - cmsis_6
          - cmsis-dsp
          - fatfs
          - segger
          - mcuboot
          - zcbor
    - name: zros
      remote: cognipilot
      revision: 3f80b3ba8803abc02ad7382cc027658b05c07ca6 # main
      path: modules/lib/zros
    - name: cyecca
      remote: cognipilot
      revision: 64d1f0dc5127d85765909f0c3525cc38305dac19 # main 11/17/25
      path: modules/lib/cyecca
    - name: synapse_pb
      remote: cognipilot
      revision: d14faa3fbce8ebe6412b252724ba3b47df1106c7 # main 12/16/25, adds Rtcm3
      path: modules/lib/synapse_pb
    - name: zros_drivers
      remote: cognipilot
      revision: caf3f6d80480497c9b3d14585814acc157ce9771 # main (MagneticField mag driver)
      path: modules/lib/zros_drivers
    - name: zephyr_boards
      remote: cognipilot
      revision: 614eed3b6432e776f107e948ccb59fda76e034c5 # main
      path: modules/lib/zephyr_boards
    - name: hcdf_models
      remote: cognipilot
      revision: main
