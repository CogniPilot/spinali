manifest:

  group-filter:
    - +optional

  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cognipilot
      url-base: https://github.com/CogniPilot

  projects:
    - name: zephyr
      remote: cognipilot
      west-commands: scripts/west-commands.yml
      revision: golden # fleet unified: enet_qos pass-all-multicast + icm45686 stream + shell/crsf
      import:
        - name-allowlist:
          - mbedtls
          - tf-psa-crypto
          - hal_nxp
          - hal_tdk
          - hal_afbr
          - cmsis
          - cmsis_6
          - cmsis-dsp
          - fatfs
          - segger
          - mcuboot
          - zcbor
    - name: zros
      remote: cognipilot
      revision: 3f80b3ba8803abc02ad7382cc027658b05c07ca6 # main
      path: modules/lib/zros
    - name: zros_drivers
      remote: cognipilot
      revision: golden # streamed sensors off protobuf, tesla mag, per-sample time_status
      path: modules/lib/zros_drivers
    - name: zephyr_boards
      remote: cognipilot
      revision: golden # 614eed3 (main) + tropic RT1064 board fixes (inert for mcxn)
      path: modules/lib/zephyr_boards
    - name: hcdf_models
      remote: cognipilot
      revision: main
      path: modules/lib/hcdf_models
    - name: zenoh-pico
      url: https://github.com/CogniPilot/zenoh-pico.git
      revision: golden # native Zephyr threads/clocks/zsock (POSIX-free) + UDP-multicast/IPv6 fixes
      path: modules/lib/zenoh-pico
